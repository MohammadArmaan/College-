<!DOCTYPE html>
<html>
    <head>
       <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <title>9th Prg</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }
            body{
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background-color: #f4f5f6;
            }
            .container{
                text-align: center;
                background: #fff;
                box-shadow: 0px 4px 8px 0px rgba(0,0,0,0.2);
                padding: 25px;
                transition: all 0.3s ease-in;
                border-radius: 9px;
            }
            .container:hover{
                transform: scale(1.02);
            }
            #paragraph{
                margin-bottom: 20px;
                color: #333;
                font-size: 18px;
                line-height: 1.5;
            }
            #list {
                margin-bottom: 20px;
                list-style: none;
                padding: 0;
                border-radius: 9px;
            }

            #list li {
                background: #e8f0fe;
                margin: 5px 0;
                padding: 10px;
                border-radius: 8px;
                transition: background 0.3s;

            }

            #list:hover{
                background: #d0e2fe;
            }

            .box{
                padding: 0 10px;
                width: 100px;
                height: 100px;
                background-color: #007bff;
                margin: 20px auto;
                line-height: 100px;
                color: #fff;
                text-align: center;
                border-radius: 8px;
                transition: all 0.3s ease-in;
            }

            button {
                padding: 12px 24px;
                margin: 10px;
                cursor: pointer;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                background: #007bff;
                color: #fff;
                transition: box-shadow 0.3s, transform 0.2s;
                box-shadow: 0px 4px 8px 0px rgba(0,0,0,0.2);
            }

            button:hover, button:focus {
                box-shadow: 0 0 0 2px #fff, 0 0 0 4px #007bff;
            }

            button:active{
                background: #004494;
                transform: translateY(0);
            }

        </style>
    </head>
    <body>
        <div class="container">
            <p id="paragraph">This is existing paragraph</p>
            <ul id="list">
                <li>List Item 1</li>
                <li>List Item 2</li>
            </ul>
            <div class="box" id="box">Animate me</div>
            <button id="appendButton">Append Content</button>
            <button id="animateButton">Animate Box</button>
        </div>
        <script>
            $(document).ready(function() {
                $("#appendButton").click(function() {
                    $("#paragraph").append(" Appended text ")
                    $("#list").append("<li>New List Item Added </li>");
                })

                $("#animateButton").click(function() {
                    $("#box").stop(true, true).css({
                        width: "100px",
                        height: "100px",
                        opacity: 1,
                        backgroundColor: "blue",
                    }).animate({
                        width: "200px",
                        height: "200px",
                        opacity: 0.5,
                    }, 1000, function(){
                        $(this).css("background-color", "green")
                    })
                })
            })

        </script>
    </body>
</html>
